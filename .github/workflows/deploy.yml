
name: HW-04 Deployment Vite AWS

on:
  push:
    branches:
      - hw-04

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Upload e Invalidate
    runs-on: ubuntu-latest

    steps:
      # Obtener el codigo del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      # Preparar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Instalar dependencias
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # BUILD: generar archivos de produccion
      - name: Build con Vite
        working-directory: frontend
        run: npm run build

      # Autenticacion con AWS
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # UPLOAD: publicar dist en S3
      - name: Upload a Amazon S3
        run: |
          aws s3 sync frontend/dist/ s3://hw04-arquisistemas-01/ --delete

      # INVALIDATE: actualizar cache de CloudFront
      - name: Invalidar cache de CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
